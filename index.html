<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>hejhub</title>
  <meta name="description" content="hejhub">
  <link rel="icon" href="favicon.svg?v=20260502" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/hej-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@500;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/hejhub.css?v=20260430bb">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <section class="hero">
        <h1><span id="dynamic-line">Every second counts.</span></h1>
      </section>

      <a class="brand" href="./" aria-label="hejhub home">
        <img src="assets/icons/hej-logo.svg" alt="">
      </a>
    </header>

    <main>
      <nav class="mode-row" aria-label="Hub mode">
        <div class="mode-switch">
          <button class="mode-button is-active" type="button" data-mode="consume" aria-pressed="true">consume</button>
          <button class="mode-button" type="button" data-mode="create" aria-pressed="false">create</button>
          <span class="mode-thumb" aria-hidden="true"></span>
        </div>
      </nav>

      <section class="panel is-active" id="consume-panel" data-panel="consume" aria-label="Consume links">
        <div class="bento">
          <a class="tile tile-letterboxd" href="https://letterboxd.com/hejrafa/" target="_blank" rel="noopener" aria-label="Letterboxd recently watched">
            <span class="tile-kicker">letterboxd</span>
            <div class="poster-stack" id="letterboxd-films">
              <span class="poster poster-a"><img src="https://a.ltrbxd.com/resized/film-poster/1/1/9/7/8/4/2/1197842-i-swear-0-600-0-900-crop.jpg?v=b8f019138e" alt="I Swear"></span>
              <span class="poster poster-b"><img src="https://a.ltrbxd.com/resized/film-poster/5/6/8/5/9/6/568596-roadrunner-a-film-about-anthony-bourdain-0-600-0-900-crop.jpg?v=a70acefc44" alt="Roadrunner: A Film About Anthony Bourdain"></span>
              <span class="poster poster-c"><img src="https://a.ltrbxd.com/resized/film-poster/2/9/3/4/6/5/293465-top-gun-maverick-0-600-0-900-crop.jpg?v=9f8af0f61b" alt="Top Gun: Maverick"></span>
              <span class="poster poster-d"><img src="https://a.ltrbxd.com/resized/film-poster/1/0/9/8/7/8/2/1098782-nuremberg-2025-0-600-0-900-crop.jpg?v=954f98ffb4" alt="Nuremberg"></span>
            </div>
            <span class="tile-title">watched</span>
          </a>

          <a class="tile tile-youtube" href="https://www.youtube.com/@casey" target="_blank" rel="noopener" aria-label="YouTube: Casey Neistat">
            <span class="tile-kicker">youtube</span>
            <img class="youtube-thumb" id="youtube-thumb" src="https://yt3.googleusercontent.com/ytc/AIdro_n4AHNRd0upuWqg3NZq4iXWP5JSbnKHh_nbzhOmgGzUc3k=s900-c-k-c0x00ffffff-no-rj" alt="Casey Neistat">
            <span class="tile-title">subs</span>
            <img src="assets/icons/youtube.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-twitch" href="https://www.twitch.tv/directory/following/live" target="_blank" rel="noopener" aria-label="Twitch following live">
            <span class="tile-kicker">twitch</span>
            <span class="tile-title">live now?</span>
            <img src="assets/icons/twitch-glitch.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-pinterest" href="https://pinterest.com/hejrafa" target="_blank" rel="noopener" aria-label="Pinterest">
            <span class="tile-kicker">pinterest</span>
            <span class="tile-title">pin pile</span>
            <img src="assets/icons/pinterest.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-bsky" href="https://bsky.app/profile/hejrafa.com" target="_blank" rel="noopener" aria-label="Bluesky">
            <span class="tile-kicker">bsky</span>
            <span class="tile-title">sky noise</span>
            <img src="assets/icons/bluesky.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-reddit" href="https://www.reddit.com" target="_blank" rel="noopener" aria-label="Reddit">
            <span class="tile-kicker">reddit</span>
            <span class="tile-title">deep cuts</span>
            <img src="assets/icons/reddit-logo.png" alt="" class="tile-icon">
          </a>

          <a class="tile tile-music" href="https://music.apple.com/us/album/the-great-divide-the-last-of-the-bugs/1894997820" target="_blank" rel="noopener" aria-label="Apple Music album">
            <span class="tile-kicker">music</span>
            <img class="album-cover" id="album-cover" src="https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/f9/aa/69/f9aa6992-40ca-a756-85ca-b27c48f7c720/26UMGIM02802.rgb.jpg/600x600bb.jpg" alt="">
            <span class="tile-title" id="album-title">fresh spin</span>
          </a>

          <a class="tile tile-books" href="https://literal.club/hejrafa/shelf/rorys-reading-list-299lk23" target="_blank" rel="noopener" aria-label="Rory's Bookshelf on Literal">
            <span class="tile-kicker">books</span>
            <img class="book-cover" id="book-cover" src="https://assets.literal.club/4/ckmauh7bi20171kjatnt6hlsd.jpg" alt="In Cold Blood">
            <span class="tile-title" id="book-title">rory shelf</span>
          </a>
        </div>
      </section>

      <section class="panel" id="create-panel" data-panel="create" aria-label="Create links" hidden>
        <div class="bento create-bento">
          <a class="tile tile-create-youtube" href="https://studio.youtube.com" target="_blank" rel="noopener" aria-label="YouTube Studio">
            <span class="tile-kicker">youtube studio</span>
            <span class="create-count" id="youtube-sub-count">--</span>
            <span class="tile-title">subs</span>
            <img src="assets/icons/youtube.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-chatgpt" href="https://chatgpt.com" target="_blank" rel="noopener" aria-label="ChatGPT">
            <span class="tile-kicker">chatgpt</span>
            <span class="tile-title">prompt<br>forge</span>
            <img src="assets/icons/chatgpt.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-umami" href="https://cloud.umami.is/analytics/eu/websites" target="_blank" rel="noopener" aria-label="Umami analytics">
            <span class="tile-kicker">umami</span>
            <span class="tile-title">site<br>pulse</span>
            <img src="assets/icons/umami.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-figma" href="https://www.figma.com/@hejrafa" target="_blank" rel="noopener" aria-label="Figma">
            <span class="tile-kicker">figma</span>
            <span class="tile-title">figma<br>jam</span>
            <img src="assets/icons/figma.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-epidemic" href="https://www.epidemicsound.com/music/featured/" target="_blank" rel="noopener" aria-label="Epidemic Sound">
            <span class="tile-kicker">epidemic</span>
            <span class="tile-title">score<br>hunt</span>
            <img src="assets/icons/epidemic.svg" alt="" class="tile-icon">
          </a>

          <a class="tile tile-github" href="https://github.com/hejrafa/hejhub" target="_blank" rel="noopener" aria-label="GitHub repository">
            <span class="tile-kicker">github</span>
            <span class="tile-title">black<br>proof</span>
            <img src="assets/icons/github.svg" alt="" class="tile-icon">
            <div class="github-dots" id="github-dots" aria-hidden="true"></div>
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="email-link" href="mailto:contact@hejrafa.com">contact@hejrafa.com</a>
    </footer>
  </div>

  <script src="assets/js/hejhub.js?v=20260430bb"></script>
</body>
</html>
