name: Refresh Letterboxd

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-letterboxd
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Fetch latest films
        run: ruby tools/update_letterboxd.rb

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Letterboxd films are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/letterboxd.json
          git commit -m "Refresh Letterboxd films"
          git pull --rebase
          git push
