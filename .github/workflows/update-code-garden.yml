name: Refresh code garden

on:
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-code-garden
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Count commits
        env:
          CODE_GARDEN_TOKEN: ${{ secrets.CODE_GARDEN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby tools/update_code_garden.rb

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Code garden is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/code-garden.json
          git commit -m "Refresh code garden"
          git pull --rebase
          git push
